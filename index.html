<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B43D0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Caja y Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: app de una columna para el celular, con barra inferior (Vender, Productos, Cierre). El cierre del día se dibuja como un ticket de caja con borde dentado. */
:root{
  --bg:#EDF0EF; --surface:#FFFFFF; --surface-2:#E2E8E5; --ink:#16211D; --muted:#5A6A64; --line:#D2D9D6;
  --accent:#2B43D0; --accent-ink:#FFFFFF; --accent-soft:#E2E6FB;
  --good:#146C47; --good-soft:#D7F0E3; --warn:#8F5200; --warn-soft:#FBEBCB; --bad:#B3261E; --bad-soft:#F9DAD7;
  --paper:#FBFBF8; --shadow:0 1px 2px rgba(20,32,28,.08),0 8px 24px rgba(20,32,28,.08);
  --font-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#171F1C; --surface-2:#232D29; --ink:#E7EEEB; --muted:#9BAAA4; --line:#2C3833;
    --accent:#93A3FF; --accent-ink:#0E1412; --accent-soft:#222A52;
    --good:#5FD3A0; --good-soft:#143326; --warn:#F0B35A; --warn-soft:#3A2D12; --bad:#FF8A80; --bad-soft:#41201D;
    --paper:#1E2723; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#171F1C; --surface-2:#232D29; --ink:#E7EEEB; --muted:#9BAAA4; --line:#2C3833;
  --accent:#93A3FF; --accent-ink:#0E1412; --accent-soft:#222A52;
  --good:#5FD3A0; --good-soft:#143326; --warn:#F0B35A; --warn-soft:#3A2D12; --bad:#FF8A80; --bad-soft:#41201D;
  --paper:#1E2723; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin-inline:auto}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:12px 16px 10px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.today{display:block;font-size:12px;color:var(--muted)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-state=cloud] i{background:var(--good)}
.sync[data-state=local] i{background:var(--warn)}
.sync[data-state=error] i{background:var(--bad)}
.note{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.view{padding-top:14px;display:flex;flex-direction:column;gap:14px}

/* controls */
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-block{width:100%}
.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.btn-link{border:0;background:none;padding:8px 4px;font-weight:600;color:var(--accent);text-decoration:underline;min-height:40px}
.btn-link.danger{color:var(--bad)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center}
.icon-btn:disabled{opacity:.4}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
textarea{font-family:var(--font-mono);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint.neg{color:var(--bad)}
.err{margin:0;font-size:14px;color:var(--bad);font-weight:600}
.row-actions{display:flex;gap:10px;flex-wrap:wrap}
.row-actions .btn{flex:1 1 140px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tools{display:flex;flex-direction:column;gap:10px}

.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag-ok{background:var(--surface-2);color:var(--muted)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-bad{background:var(--bad-soft);color:var(--bad)}

/* sell grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;padding:8px 8px 10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:0}
.pcard:active:not(:disabled){transform:scale(.98)}
.pcard.in-cart{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pcard.is-out{opacity:.6}
.ph{position:relative;display:block;aspect-ratio:1/1;max-width:100%;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.pimg{width:100%;height:100%;object-fit:cover;display:block}
.noimg{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:34px;font-weight:800;color:var(--muted)}
.qty-badge{position:absolute;top:6px;right:6px;min-width:28px;height:28px;padding:0 8px;display:grid;place-items:center;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px}
.pc-title{font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.price{font-family:var(--font-mono);font-weight:600;font-size:15px}
.empty-card{grid-column:1/-1;padding:20px 16px;border:1px dashed var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.empty-card h2{margin:0;font-size:18px}
.empty-card p{margin:0;color:var(--muted);font-size:15px}
.empty{color:var(--muted);text-align:center;padding:24px 0;margin:0}

.cartbar{position:fixed;left:16px;right:16px;max-width:560px;margin-inline:auto;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 10px);z-index:25;min-height:56px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;box-shadow:var(--shadow)}
.cartbar b{font-family:var(--font-mono);font-size:17px}

/* product list */
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.thumb{width:56px;height:56px;border-radius:8px;overflow:hidden;background:var(--surface-2);display:block}
.thumb .noimg{font-size:22px}
.prow-title{display:block;font-weight:600;overflow-wrap:anywhere}
.prow-sub{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.summary{font-size:13px;color:var(--muted);margin:0}

/* sheets */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(10,16,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);outline:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-head h2{margin:0;font-size:20px}
.sheet-body{display:flex;flex-direction:column;gap:14px}
.photo-row{display:flex;gap:14px;align-items:center}
.photo-prev{width:96px;height:96px;flex:none;border-radius:12px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center}
.photo-prev img{width:100%;height:100%;object-fit:cover;display:block}
.photo-actions{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:none;font-size:22px;font-weight:700}
.stepper button:disabled{opacity:.35}
.stepper output,.stepper input{min-width:44px;text-align:center;font-weight:700;font-family:var(--font-mono)}
.stepper input{width:72px;border:0;border-radius:0;min-height:44px;padding:0}
.cart-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cl-title{font-weight:600;overflow-wrap:anywhere}
.cl-total{text-align:right;font-weight:600}
.cl-sub{font-size:13px;color:var(--muted)}
.cl-end{display:flex;justify-content:flex-end}
.pays{display:flex;gap:8px;flex-wrap:wrap}
.total-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.total-row span{font-weight:600;color:var(--muted)}
.total-row b{font-family:var(--font-mono);font-size:28px;font-weight:600}
.cat-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cat-name{font-weight:600;overflow-wrap:anywhere;min-width:0}
.cat-name small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.cat-ops{display:flex;gap:4px;flex-wrap:wrap}
.inline-form{display:flex;gap:8px;width:100%}
.inline-form input{flex:1;min-width:0}
.confirm{padding:12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);display:flex;flex-direction:column;gap:10px;font-size:14px;font-weight:600}
.confirm .row-actions .btn{min-height:44px}

/* report */
.daybar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px}
.daybar input{text-align:center;font-weight:600}
.ticket{position:relative;background:var(--paper);color:var(--ink);border-radius:6px 6px 0 0;padding:20px 18px 24px;box-shadow:var(--shadow);margin-bottom:20px}
.ticket::after{content:"";position:absolute;left:0;right:0;top:100%;height:6px;background:conic-gradient(from -45deg at bottom,transparent,var(--paper) 1deg 89deg,transparent 90deg) 50%/12px 100%}
.t-title{font-family:var(--font-mono);font-weight:600;letter-spacing:.16em;text-align:center;font-size:15px}
.t-date{font-family:var(--font-mono);text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
.t-date::first-letter{text-transform:uppercase}
.t-rule{border-top:1.5px dashed var(--muted);opacity:.5;margin:14px 0}
.t-h{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.t-row{display:flex;align-items:baseline;gap:6px;font-family:var(--font-mono);font-size:13px;line-height:1.75}
.t-row i{flex:1;min-width:12px;border-bottom:1px dotted var(--muted);transform:translateY(-3px)}
.t-row span{min-width:0;overflow-wrap:anywhere}
.t-row b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.t-row.big{font-size:17px;font-weight:600}
.t-row.good b{color:var(--good)}
.t-row.bad b{color:var(--bad)}
.t-empty{font-family:var(--font-mono);font-size:13px;color:var(--muted);text-align:center;margin:18px 0 6px}
.t-foot{display:flex;justify-content:center;margin-top:18px}
.stamp{display:inline-block;border:2px solid currentColor;padding:4px 12px;border-radius:4px;transform:rotate(-3deg);font:600 13px var(--font-mono);letter-spacing:.1em}
.stamp.closed{color:var(--good)}
.stamp.open{color:var(--muted);border-style:dashed}
.banner{padding:12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h2{margin:0;font-size:15px}
.low-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.low-list li{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.low-list li span:first-child{min-width:0;overflow-wrap:anywhere}
.sales{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sale{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sale-top{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.sale-items{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.sale-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pay-tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.section-title{margin:6px 0 0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* nav + toast */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{height:var(--nav-h);border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nav button[aria-current=page]{color:var(--accent)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:16px;right:16px;max-width:520px;margin-inline:auto;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 78px);z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:15px;font-weight:600;text-align:center;box-shadow:var(--shadow)}
.export{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.export summary{font-weight:700;cursor:pointer;min-height:32px;display:flex;align-items:center}
.export-body{display:flex;flex-direction:column;gap:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div>
      <h1>Caja y Stock</h1>
      <span class="today" id="today"></span>
    </div>
    <span class="sync" id="sync" data-state="loading" role="status"><i></i><span id="sync-t">Conectando…</span></span>
  </header>
  <div class="note" id="localnote" hidden>Los datos se guardan solo en este navegador. Abrí la página desde Claude con tu cuenta para guardarlos en la nube.</div>

  <main id="main">
    <section class="view" id="view-sell" aria-label="Vender">
      <div class="tools" id="sell-tools" hidden>
        <label class="field"><span class="sr-only">Buscar producto</span><input id="q" type="search" placeholder="Buscar producto" autocomplete="off"></label>
        <div class="chips" id="sell-chips"></div>
      </div>
      <div class="grid" id="sell-grid"></div>
    </section>

    <section class="view" id="view-prod" aria-label="Productos" hidden>
      <div class="row-actions">
        <button class="btn btn-primary" data-act="new-product" type="button">+ Producto</button>
        <button class="btn" data-act="open-cats" type="button">Categorías</button>
        <button class="btn" data-act="open-backup" type="button">Copia de seguridad</button>
      </div>
      <p class="summary" id="prod-summary"></p>
      <div class="tools" id="prod-tools" hidden>
        <label class="field"><span class="sr-only">Buscar producto</span><input id="pq" type="search" placeholder="Buscar en tus productos" autocomplete="off"></label>
        <div class="chips" id="prod-stock" aria-label="Filtrar por stock"></div>
        <div class="chips" id="prod-chips"></div>
      </div>
      <ul class="plist" id="prod-list"></ul>
    </section>

    <section class="view" id="view-report" aria-label="Cierre" hidden>
      <div class="daybar">
        <button class="icon-btn" data-act="day-prev" type="button" aria-label="Día anterior">‹</button>
        <input id="rday" type="date" aria-label="Día del cierre">
        <button class="icon-btn" data-act="day-next" type="button" aria-label="Día siguiente">›</button>
      </div>
      <details class="export" id="export">
        <summary>Exportar a Excel</summary>
        <div class="export-body">
          <p class="hint">Elegí el período y descargá un archivo con resumen, detalle de ventas, ventas por producto e inventario.</p>
          <div class="chips">
            <button class="chip" type="button" data-act="exp-preset" data-p="today" aria-pressed="false">Hoy</button>
            <button class="chip" type="button" data-act="exp-preset" data-p="week" aria-pressed="false">Esta semana</button>
            <button class="chip" type="button" data-act="exp-preset" data-p="month" aria-pressed="false">Este mes</button>
            <button class="chip" type="button" data-act="exp-preset" data-p="prev" aria-pressed="false">Mes anterior</button>
          </div>
          <div class="two">
            <label class="field">Desde<input id="exp-from" type="date"></label>
            <label class="field">Hasta<input id="exp-to" type="date"></label>
          </div>
          <button class="btn btn-primary btn-block" type="button" data-act="exp-go">Descargar Excel (.xlsx)</button>
        </div>
      </details>
      <div id="report"></div>
    </section>
  </main>
</div>

<button class="cartbar" id="cartbar" data-act="open-cart" type="button" hidden></button>

<nav class="nav" aria-label="Secciones">
  <button type="button" data-act="tab" data-tab="sell"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L19 8H6"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>Vender</button>
  <button type="button" data-act="tab" data-tab="prod"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>Productos</button>
  <button type="button" data-act="tab" data-tab="report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Cierre</button>
</nav>

<div class="backdrop" id="backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" type="button" data-act="close-sheet" aria-label="Cerrar">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var norm=function(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()};
var LOW=3;
var PAYS=[['efectivo','Efectivo'],['transferencia','Transferencia'],['tarjeta','Tarjeta']];
var payName=function(k){for(var i=0;i<PAYS.length;i++)if(PAYS[i][0]===k)return PAYS[i][1];return 'Otro'};
var nf=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:0,maximumFractionDigits:2});
var money=function(n){return nf.format(Number(n)||0)};
var pct=function(x){return (x*100).toLocaleString('es-AR',{maximumFractionDigits:1})+' %'};
var pad=function(n){return String(n).padStart(2,'0')};
var dayKey=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parseDay=function(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
var addDays=function(k,n){var d=parseDay(k);d.setDate(d.getDate()+n);return dayKey(d)};
var hhmm=function(ts){return new Date(ts).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false})};
var longDay=function(k){return parseDay(k).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};
var newId=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var byTitle=function(a,b){return String(a.title).localeCompare(String(b.title),'es')};

function parseMoney(v){
  var s=String(v==null?'':v).replace(/[^\d.,-]/g,'');
  if(!s)return null;
  var hasC=s.indexOf(',')>-1, hasD=s.indexOf('.')>-1;
  if(hasC&&hasD){s=s.replace(/\./g,'').replace(',','.')}
  else if(hasC){s=s.replace(',','.')}
  else if(hasD&&/^-?\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}
  var n=parseFloat(s);
  return isFinite(n)?n:null;
}

/* ---------- state ---------- */
var COLS=['categories','products','sales','closings'];
var S={categories:{},products:{},sales:{},closings:{}};
var loaded={categories:false,products:false,sales:false,closings:false};
var mode='loading', dbh=null, dl=true, syncErr=false;
var tab='sell';
try{tab=localStorage.getItem('cys.tab')||'sell'}catch(e){}
if(['sell','prod','report'].indexOf(tab)<0)tab='sell';
var qSell='',qProd='',catSell='',catProd='',stockF='';
var reportDay=dayKey(new Date());
var cart={}, pay='efectivo';
var voidId=null, editCat=null, catDelId=null, pendingBackup=null;
var sheetKind=null;
var pf={id:null,photo:null};
var LS_KEY='cajaystock.v1';

var raf=0;
function schedule(){if(!raf){raf=requestAnimationFrame(function(){raf=0;render()})}}

function fail(e){try{console.error(e)}catch(x){}toast('No se pudo guardar en el teléfono. Probá de nuevo.')}
var idb=null;
function idbOpen(){return new Promise(function(res,rej){var r=indexedDB.open('cajaystock',1);r.onupgradeneeded=function(){var d=r.result;COLS.forEach(function(c){if(!d.objectStoreNames.contains(c))d.createObjectStore(c)})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function idbLoadAll(){var tx=idb.transaction(COLS,'readonly');return Promise.all(COLS.map(function(c){return new Promise(function(res,rej){var m={},rq=tx.objectStore(c).openCursor();rq.onsuccess=function(){var cur=rq.result;if(cur){m[cur.key]=cur.value;cur.continue()}else{S[c]=m;res()}};rq.onerror=function(){rej(rq.error)}})}))}
function idbWrite(col,id,data){return new Promise(function(res,rej){var tx=idb.transaction(col,'readwrite'),st=tx.objectStore(col);if(data===null)st.delete(id);else st.put(data,id);tx.oncomplete=function(){res(true)};tx.onerror=tx.onabort=function(){rej(tx.error)}})}
function idbReplaceAll(d){return new Promise(function(res,rej){var tx=idb.transaction(COLS,'readwrite');COLS.forEach(function(c){var st=tx.objectStore(c);st.clear();Object.keys(d[c]||{}).forEach(function(k){st.put(d[c][k],k)})});tx.oncomplete=function(){res()};tx.onabort=tx.onerror=function(){rej(tx.error)}})}
function put(col,id,data){
  if(mode==='loading'){toast('Esperá un momento, se está abriendo el almacenamiento.');return Promise.resolve(false)}
  S[col][id]=data;schedule();
  return idbWrite(col,id,data).then(function(){return true},function(e){fail(e);return false});
}
function del(col,id){
  if(mode==='loading')return Promise.resolve(false);
  delete S[col][id];schedule();
  return idbWrite(col,id,null).then(function(){return true},function(e){fail(e);return false});
}

/* ---------- selectors ---------- */
function prods(){return Object.keys(S.products).map(function(id){var p=S.products[id];return Object.assign({},p,{id:id})})}
function cats(){return Object.keys(S.categories).map(function(id){return {id:id,name:S.categories[id].name}}).sort(function(a,b){return a.name.localeCompare(b.name,'es')})}
function catName(id){return id&&S.categories[id]?S.categories[id].name:'Sin categoría'}
function stockTag(n){n=Number(n)||0;if(n<=0)return ['bad','Sin stock'];if(n<=LOW)return ['warn','Quedan '+n];return ['ok',n+' en stock']}
function cartLines(){
  var out=[];
  Object.keys(cart).forEach(function(id){
    var p=S.products[id];if(!p||p.stock<=0)return;
    var qty=Math.min(cart[id],p.stock);if(qty<=0)return;
    out.push({p:Object.assign({},p,{id:id}),qty:qty});
  });
  return out.sort(function(a,b){return byTitle(a.p,b.p)});
}
function cartTotals(lines){var t=0,u=0;lines.forEach(function(l){t+=l.p.price*l.qty;u+=l.qty});return {total:t,units:u}}

function dayData(day){
  var sales=Object.keys(S.sales).map(function(id){return Object.assign({},S.sales[id],{id:id})}).filter(function(s){return s.day===day}).sort(function(a,b){return a.ts-b.ts});
  var total=0,cost=0,units=0,pays={},items={};
  sales.forEach(function(s){
    total+=s.total;cost+=s.costTotal;units+=s.units;pays[s.pay]=(pays[s.pay]||0)+s.total;
    s.lines.forEach(function(l){var k=l.pid||l.title;var it=items[k]||(items[k]={title:l.title,qty:0,rev:0});it.qty+=l.qty;it.rev+=l.price*l.qty});
  });
  return {sales:sales,count:sales.length,total:total,cost:cost,profit:total-cost,units:units,pays:pays,
    items:Object.keys(items).map(function(k){return items[k]}).sort(function(a,b){return b.rev-a.rev})};
}

/* ---------- rendering ---------- */
function setHTML(el,html){if(el._h!==html){el.innerHTML=html;el._h=html}}
function photoHTML(p,cls){
  return p.photo?'<img class="'+cls+'" src="'+esc(p.photo)+'" alt="" loading="lazy">'
    :'<span class="'+cls+' noimg" aria-hidden="true">'+esc(String(p.title||'?').trim().charAt(0).toUpperCase())+'</span>';
}
function chipsHTML(list,sel,act){
  if(!list.length)return '';
  return '<button class="chip" type="button" data-act="'+act+'" data-cat="" aria-pressed="'+(!sel)+'">Todas</button>'+
    list.map(function(c){return '<button class="chip" type="button" data-act="'+act+'" data-cat="'+esc(c.id)+'" aria-pressed="'+(sel===c.id)+'">'+esc(c.name)+'</button>'}).join('');
}
function emptyCatalog(){
  return '<div class="empty-card"><h2>Todavía no cargaste productos</h2><p>Primero creá tus categorías y después sumá cada producto con foto, costo, precio y stock. Cuando estén cargados, vas a poder venderlos desde acá.</p><button class="btn btn-primary" type="button" data-act="tab" data-tab="prod">Cargar productos</button></div>';
}

function renderHeader(){
  $('#today').textContent=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  var st=syncErr?'error':mode, txt={cloud:'Guardado en la nube',local:'Guardado en el teléfono',loading:'Abriendo…',error:'No se puede guardar'}[st];
  var el=$('#sync');el.setAttribute('data-state',st);$('#sync-t').textContent=txt;
  $('#localnote').hidden=true;
}
function renderNav(){
  document.querySelectorAll('.nav button').forEach(function(b){
    if(b.getAttribute('data-tab')===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  ['sell','prod','report'].forEach(function(t){$('#view-'+t).hidden=t!==tab});
}
function renderSell(){
  var cl=cats();
  if(catSell&&!S.categories[catSell])catSell='';
  setHTML($('#sell-chips'),chipsHTML(cl,catSell,'chip-sell'));
  var grid=$('#sell-grid');
  if(!loaded.products){$('#sell-tools').hidden=true;setHTML(grid,'<p class="empty" style="grid-column:1/-1">Cargando productos…</p>');return}
  var all=prods();
  if(!all.length){$('#sell-tools').hidden=true;setHTML(grid,emptyCatalog());return}
  $('#sell-tools').hidden=false;
  var q=norm(qSell);
  var list=all.filter(function(p){return (!catSell||p.cat===catSell)&&(!q||norm(p.title).indexOf(q)>-1)}).sort(byTitle);
  if(!list.length){setHTML(grid,'<p class="empty" style="grid-column:1/-1">No hay productos con ese filtro.</p>');return}
  setHTML(grid,list.map(function(p){
    var out=p.stock<=0,inCart=Math.min(cart[p.id]||0,p.stock),st=stockTag(p.stock);
    return '<button class="pcard'+(out?' is-out':'')+(inCart?' in-cart':'')+'" type="button" data-act="add" data-id="'+esc(p.id)+'"'+(out?' disabled':'')+' aria-label="Agregar '+esc(p.title)+', '+esc(money(p.price))+'">'+
      '<span class="ph">'+photoHTML(p,'pimg')+(inCart?'<span class="qty-badge">'+inCart+'</span>':'')+'</span>'+
      '<span class="pc-title">'+esc(p.title)+'</span>'+
      '<span class="pc-row"><b class="price">'+money(p.price)+'</b><span class="tag tag-'+st[0]+'">'+st[1]+'</span></span></button>';
  }).join(''));
}
function renderProd(){
  var cl=cats();
  if(catProd&&!S.categories[catProd])catProd='';
  setHTML($('#prod-chips'),chipsHTML(cl,catProd,'chip-prod'));
  var allP=prods(),inCat=allP.filter(function(p){return !catProd||p.cat===catProd});
  var nOut=inCat.filter(function(p){return p.stock<=0}).length,nLow=inCat.filter(function(p){return p.stock>0&&p.stock<=LOW}).length;
  setHTML($('#prod-stock'),allP.length?[['','Todos'],['out','Sin stock ('+nOut+')'],['low','Poco stock ('+nLow+')']].map(function(c){
    return '<button class="chip" type="button" data-act="chip-stock" data-s="'+c[0]+'" aria-pressed="'+(stockF===c[0])+'">'+esc(c[1])+'</button>';
  }).join(''):'');
  var list=$('#prod-list');
  if(!loaded.products){$('#prod-tools').hidden=true;$('#prod-summary').textContent='';setHTML(list,'<li class="empty">Cargando productos…</li>');return}
  var all=prods();
  if(!all.length){
    $('#prod-tools').hidden=true;$('#prod-summary').textContent='';
    setHTML(list,'<li class="empty-card" style="list-style:none"><h2>Armá tu catálogo</h2><p>1. Creá las categorías (por ejemplo Bebidas, Golosinas, Limpieza). 2. Agregá cada producto con título, costo, precio de venta, stock y una foto.</p></li>');
    return;
  }
  $('#prod-tools').hidden=false;
  var units=0,vc=0,vp=0;
  all.forEach(function(p){units+=p.stock;vc+=p.stock*p.cost;vp+=p.stock*p.price});
  $('#prod-summary').textContent=all.length+(all.length===1?' producto · ':' productos · ')+units+' unidades · Stock a costo '+money(vc)+' · a precio de venta '+money(vp);
  var q=norm(qProd);
  var f=all.filter(function(p){
    if(catProd&&p.cat!==catProd)return false;
    if(stockF==='out'&&p.stock>0)return false;
    if(stockF==='low'&&!(p.stock>0&&p.stock<=LOW))return false;
    return !q||norm(p.title).indexOf(q)>-1;
  }).sort(byTitle);
  if(catProd||q||stockF)$('#prod-summary').textContent+=' · Mostrando '+f.length;
  if(!f.length){setHTML(list,'<li class="empty">'+(stockF==='out'?'No hay productos sin stock con este filtro.':stockF==='low'?'No hay productos con poco stock con este filtro.':'No hay productos con ese filtro.')+'</li>');return}
  setHTML(list,f.map(function(p){
    var st=stockTag(p.stock);
    return '<li><button class="prow" type="button" data-act="edit-product" data-id="'+esc(p.id)+'">'+
      '<span class="thumb">'+photoHTML(p,'pimg')+'</span>'+
      '<span><span class="prow-title">'+esc(p.title)+'</span><span class="prow-sub">'+esc(catName(p.cat))+' · Costo '+esc(money(p.cost))+' · Venta '+esc(money(p.price))+'</span></span>'+
      '<span class="tag tag-'+st[0]+'">'+(p.stock<=0?'Sin stock':p.stock+' u.')+'</span></button></li>';
  }).join(''));
}
function row(label,val,cls){return '<div class="t-row'+(cls?' '+cls:'')+'"><span>'+label+'</span><i></i><b>'+val+'</b></div>'}
function renderReport(){
  var inp=$('#rday');inp.value=reportDay;inp.max=dayKey(new Date());$('#exp-from').max=$('#exp-to').max=dayKey(new Date());
  var isToday=reportDay>=dayKey(new Date());
  document.querySelector('[data-act=day-next]').disabled=isToday;
  var el=$('#report');
  if(!loaded.sales||!loaded.closings||!loaded.products){setHTML(el,'<p class="empty">Cargando ventas…</p>');return}
  var d=dayData(reportDay),cl=S.closings[reportDay],later=cl?d.sales.filter(function(s){return s.ts>cl.closedAt}).length:0;
  var h='';
  if(cl&&later)h+='<div class="banner">Hay '+later+(later===1?' venta posterior':' ventas posteriores')+' al cierre de las '+hhmm(cl.closedAt)+'. Actualizá el cierre para incluirlas.</div>';
  h+='<article class="ticket" aria-label="Cierre de caja"><div class="t-title">CIERRE DE CAJA</div><div class="t-date">'+esc(longDay(reportDay))+'</div><div class="t-rule"></div>';
  if(!d.count){
    h+='<p class="t-empty">Sin ventas registradas este día.</p>';
  }else{
    h+=row('Ventas',d.count)+row('Unidades',d.units)+'<div class="t-rule"></div>';
    h+=row('Total vendido',esc(money(d.total)),'big')+row('Costo de mercadería',esc(money(d.cost)))+
      row('Ganancia',esc(money(d.profit)),d.profit<0?'bad':'good')+row('Margen',d.total>0?pct(d.profit/d.total):'—')+'<div class="t-rule"></div>';
    h+='<div class="t-h">Cobrado por</div>';
    var pk=Object.keys(d.pays).sort();
    pk.forEach(function(k){h+=row(esc(payName(k)),esc(money(d.pays[k])))});
    h+='<div class="t-rule"></div><div class="t-h">Productos vendidos</div>';
    d.items.forEach(function(it){h+=row(it.qty+' × '+esc(it.title),esc(money(it.rev)))});
  }
  h+='<div class="t-foot">'+(cl?'<span class="stamp closed">CERRADO '+hhmm(cl.closedAt)+'</span>':'<span class="stamp open">SIN CERRAR</span>')+'</div></article>';
  h+='<div class="row-actions">';
  if(cl&&later)h+='<button class="btn btn-primary" type="button" data-act="close-day">Actualizar cierre</button>';
  else if(cl)h+='<button class="btn" type="button" data-act="reopen-day">Reabrir el día</button>';
  else h+='<button class="btn btn-primary" type="button" data-act="close-day"'+(d.count?'':' disabled')+'>Cerrar el día</button>';
  h+='<button class="btn" type="button" data-act="copy-summary"'+(d.count?'':' disabled')+'>Copiar resumen</button>';
  if(dl)h+='<button class="btn" type="button" data-act="download-csv"'+(d.count?'':' disabled')+'>Descargar CSV</button>';
  h+='</div>';
  var low=prods().filter(function(p){return p.stock<=LOW}).sort(function(a,b){return a.stock-b.stock||byTitle(a,b)});
  if(low.length){
    h+='<section class="card"><h2>Para reponer (quedan '+LOW+' o menos)</h2><ul class="low-list">'+
      low.slice(0,8).map(function(p){var st=stockTag(p.stock);return '<li><span>'+esc(p.title)+'</span><span class="tag tag-'+st[0]+'">'+(p.stock<=0?'Sin stock':p.stock+' u.')+'</span></li>'}).join('')+
      '</ul>'+(low.length>8?'<p class="hint">y '+(low.length-8)+' más</p>':'')+'</section>';
  }
  if(d.count){
    h+='<h2 class="section-title">Ventas del día</h2><ul class="sales">'+d.sales.slice().reverse().map(function(s){
      var items=s.lines.map(function(l){return l.qty+' × '+esc(l.title)}).join(', ');
      var foot=voidId===s.id
        ?'<div class="confirm">Se devuelve el stock de esta venta. ¿Anularla?<div class="row-actions"><button class="btn btn-danger" type="button" data-act="void-yes" data-id="'+esc(s.id)+'">Sí, anular</button><button class="btn" type="button" data-act="void-no">No</button></div></div>'
        :'<div class="sale-foot"><span class="pay-tag">'+esc(payName(s.pay))+'</span><button class="btn-link danger" type="button" data-act="void-sale" data-id="'+esc(s.id)+'">Anular venta</button></div>';
      return '<li class="sale"><div class="sale-top"><span class="mono">'+hhmm(s.ts)+'</span><span class="mono">'+esc(money(s.total))+'</span></div><div class="sale-items">'+items+'</div>'+foot+'</li>';
    }).join('')+'</ul>';
  }
  setHTML(el,h);
}
function renderCartbar(){
  var lines=cartLines(),b=$('#cartbar');
  if(tab!=='sell'||!lines.length){b.hidden=true;return}
  var t=cartTotals(lines);
  b.hidden=false;
  b.innerHTML='<span>'+t.units+(t.units===1?' artículo':' artículos')+'</span><b>Cobrar '+esc(money(t.total))+'</b>';
}
function render(){
  renderHeader();renderNav();
  if(tab==='sell')renderSell();else if(tab==='prod')renderProd();else renderReport();
  renderCartbar();
}

/* ---------- sheets ---------- */
function openSheet(kind,title,html){
  sheetKind=kind;$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=html;
  $('#backdrop').hidden=false;document.body.classList.add('lock');$('#sheet').focus();
}
function closeSheet(){sheetKind=null;$('#backdrop').hidden=true;document.body.classList.remove('lock');editCat=null;catDelId=null}
function setSheetBody(html){$('#sheet-body').innerHTML=html}

function cartHTML(){
  var lines=cartLines(),t=cartTotals(lines);
  var h='<ul class="cart-list">'+lines.map(function(l){
    var p=l.p;
    return '<li class="cline"><span class="cl-title">'+esc(p.title)+'</span><b class="cl-total mono">'+esc(money(p.price*l.qty))+'</b>'+
      '<span class="cl-sub">'+esc(money(p.price))+' c/u</span>'+
      '<span class="cl-end"><span class="stepper" role="group" aria-label="Cantidad de '+esc(p.title)+'"><button type="button" data-act="cart-dec" data-id="'+esc(p.id)+'" aria-label="Quitar uno">−</button><output>'+l.qty+'</output><button type="button" data-act="cart-inc" data-id="'+esc(p.id)+'" aria-label="Sumar uno"'+(l.qty>=p.stock?' disabled':'')+'>+</button></span></span></li>';
  }).join('')+'</ul>';
  h+='<div><div class="section-title" style="margin:0 0 8px">Cómo pagó</div><div class="pays">'+
    PAYS.map(function(p){return '<button class="chip" type="button" data-act="pay" data-pay="'+p[0]+'" aria-pressed="'+(pay===p[0])+'">'+p[1]+'</button>'}).join('')+'</div></div>';
  h+='<div class="total-row"><span>Total</span><b>'+esc(money(t.total))+'</b></div>';
  h+='<button class="btn btn-primary btn-block" type="button" data-act="sell-confirm">Registrar venta</button>';
  h+='<button class="btn-link danger" type="button" data-act="cart-clear">Vaciar carrito</button>';
  return h;
}
function openCart(){if(!cartLines().length)return;openSheet('cart','Venta actual',cartHTML())}
function refreshCart(){
  if(sheetKind!=='cart')return;
  if(!cartLines().length){closeSheet();return}
  setSheetBody(cartHTML());
}

function catsHTML(){
  var cl=cats(),counts={};
  prods().forEach(function(p){if(p.cat)counts[p.cat]=(counts[p.cat]||0)+1});
  var h='<form id="cform" class="inline-form" autocomplete="off"><input id="cf-name" maxlength="40" placeholder="Nueva categoría (ej. Bebidas)" aria-label="Nombre de la categoría"><button class="btn btn-primary" type="submit">Agregar</button></form>';
  if(!cl.length)return h+'<p class="hint">Todavía no hay categorías. Agregá la primera arriba.</p>';
  h+='<div>'+cl.map(function(c){
    var n=counts[c.id]||0;
    if(editCat===c.id)return '<div class="cat-row"><form id="crform" class="inline-form" data-id="'+esc(c.id)+'"><input id="cr-name" maxlength="40" value="'+esc(c.name)+'" aria-label="Nuevo nombre"><button class="btn btn-primary" type="submit">Guardar</button><button class="btn" type="button" data-act="cat-cancel">Cancelar</button></form></div>';
    if(catDelId===c.id)return '<div class="cat-row"><div class="confirm" style="width:100%">¿Eliminar la categoría “'+esc(c.name)+'”?<div class="row-actions"><button class="btn btn-danger" type="button" data-act="cat-delete-yes" data-id="'+esc(c.id)+'">Sí, eliminar</button><button class="btn" type="button" data-act="cat-cancel">No</button></div></div></div>';
    return '<div class="cat-row"><span class="cat-name">'+esc(c.name)+'<small>'+n+(n===1?' producto':' productos')+'</small></span><span class="cat-ops"><button class="btn-link" type="button" data-act="cat-rename" data-id="'+esc(c.id)+'">Renombrar</button><button class="btn-link danger" type="button" data-act="cat-delete" data-id="'+esc(c.id)+'">Eliminar</button></span></div>';
  }).join('')+'</div>';
  return h;
}
function openCats(){editCat=null;catDelId=null;openSheet('cats','Categorías',catsHTML())}
function refreshCats(focusId){
  if(sheetKind!=='cats')return;
  setSheetBody(catsHTML());
  if(focusId){var e=$(focusId);if(e){e.focus();if(e.select)e.select()}}
}

function productForm(id){
  var p=id?S.products[id]:null;
  pf={id:id||null,photo:p&&p.photo?p.photo:null};

function saveProduct(){
  var title=$('#pf-title').value.trim(),err=$('#pf-err');
  var cost=parseMoney($('#pf-cost').value),price=parseMoney($('#pf-price').value);
  var stock=parseInt($('#pf-stock').value,10);

function addToCart(id){
  var p=S.products[id];if(!p)return;
  if(p.stock<=0){toast('Sin stock');return}
  var cur=cart[id]||0;
  if(cur>=p.stock){toast('No hay más stock de '+p.title);return}
  cart[id]=cur+1;
  try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}
  schedule();
}
function confirmSale(){
  var lines=cartLines();if(!lines.length)return;
  var t=cartTotals(lines),now=Date.now(),id=newId(),cost=0;
  lines.forEach(function(l){cost+=l.p.cost*l.qty});
  var sale={ts:now,day:dayKey(new Date(now)),pay:pay,units:t.units,total:t.total,costTotal:cost,
    lines:lines.map(function(l){return {pid:l.p.id,title:l.p.title,qty:l.qty,price:l.p.price,cost:l.p.cost}})};
  closeSheet();cart={};schedule();
  put('sales',id,sale).then(function(ok){
    if(!ok)return;
    var chain=Promise.resolve();
    lines.forEach(function(l){
      chain=chain.then(function(){
        var cur=S.products[l.p.id];if(!cur)return;
        return put('products',l.p.id,Object.assign({},cur,{stock:Math.max(0,cur.stock-l.qty),updatedAt:now}));
      });
    });
    return chain.then(function(){toast('Venta registrada · '+money(t.total))});
  });
}
function voidSale(id){
  var s=S.sales[id];if(!s)return;
  var chain=Promise.resolve();
  s.lines.forEach(function(l){
    chain=chain.then(function(){
      var cur=S.products[l.pid];if(!cur)return;
      return put('products',l.pid,Object.assign({},cur,{stock:cur.stock+l.qty,updatedAt:Date.now()}));
    });
  });
  chain.then(function(){return del('sales',id)}).then(function(){toast('Venta anulada. El stock volvió.')});
}

      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook '+NS+' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>'+
      names.map(function(n,i){return '<sheet name="'+X(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>'}).join('')+'</sheets><calcPr fullCalcOnLoad="1"/></workbook>'},
    {name:'xl/_rels/workbook.xml.rels',text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      names.map(function(n,i){return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>'}).join('')+
      '<Relationship Id="rId5" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/styles.xml',text:STYLES_XML}
  ];
  sheets.forEach(function(x,i){files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',text:x})});
  return zip(files);
}
function salesInRange(from,to){
  return Object.keys(S.sales).map(function(id){return Object.assign({},S.sales[id],{id:id})}).filter(function(s){return s.day>=from&&s.day<=to}).sort(function(a,b){return a.ts-b.ts});
}
function setPreset(p){
  var d=new Date(),t=dayKey(d),from=t,to=t;
  if(p==='week')from=addDays(t,-((d.getDay()+6)%7));
  else if(p==='month')from=t.slice(0,8)+'01';
  else if(p==='prev'){from=dayKey(new Date(d.getFullYear(),d.getMonth()-1,1));to=dayKey(new Date(d.getFullYear(),d.getMonth(),0))}
  $('#exp-from').value=from;$('#exp-to').value=to;
}
function exportExcel(){
  var from=$('#exp-from').value,to=$('#exp-to').value;
  if(!from||!to){toast('Elegí las dos fechas.');return}
  if(from>to){var t=from;from=to;to=t}
  var sales=salesInRange(from,to);
  if(!sales.length){toast('No hay ventas en ese período.');return}
  try{saveFile('reporte-ventas_'+from+'_a_'+to+'.xlsx',buildWorkbook(from,to,sales),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}
  catch(e){try{console.error(e)}catch(x){}toast('No se pudo armar el archivo de Excel.')}
}
/*XLSX-END*/
function saveFile(name,text,type){
  try{
    var b=new Blob([text],{type:type}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('Archivo descargado');
  }catch(e){toast('No se pudo descargar el archivo.')}
}
function backupHTML(){
  return '<p class="hint">Tus datos están solo en este teléfono. Descargá una copia de vez en cuando. Si cambiás de celular o borrás los datos del navegador, la restaurás desde acá.</p>'+
    '<button class="btn btn-primary btn-block" type="button" data-act="backup-export">Descargar copia</button>'+
    '<label class="btn btn-block">Restaurar una copia<input id="bk-file" class="sr-only" type="file" accept=".json,application/json"></label>'+
    '<p class="err" id="bk-err" role="alert" hidden></p>';
}
function exportBackup(){
  saveFile('caja-y-stock-'+dayKey(new Date())+'.json',JSON.stringify({app:'caja-y-stock',version:1,exportedAt:Date.now(),data:S}),'application/json');
}
function restoreBackup(){
  var o=pendingBackup;if(!o)return;
  var d={};COLS.forEach(function(c){d[c]=o.data[c]||{}});
  idbReplaceAll(d).then(function(){COLS.forEach(function(c){S[c]=d[c]});cart={};pendingBackup=null;closeSheet();schedule();toast('Copia restaurada')},fail);
}
function csvCell(v){v=String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function num(n){return String(Math.round(n*100)/100).replace('.',',')}
function downloadCsv(){
  if(!dl)return;
  var d=dayData(reportDay),rows=[['Fecha','Hora','Producto','Cantidad','Precio unitario','Costo unitario','Subtotal','Medio de pago']];
  d.sales.forEach(function(s){s.lines.forEach(function(l){rows.push([reportDay,hhmm(s.ts),l.title,l.qty,num(l.price),num(l.cost),num(l.price*l.qty),payName(s.pay)])})});
  var csv='﻿'+rows.map(function(r){return r.map(csvCell).join(';')}).join('\r\n');
  saveFile('ventas-'+reportDay+'.csv',csv,'text/csv;charset=utf-8');
}
function setDay(k){
  var today=dayKey(new Date());
  if(k>today)k=today;
  if(k===reportDay)return;
  reportDay=k;voidId=null;
  if(mode==='cloud')subSales();
  schedule();
}
function setTab(t){
  tab=t;try{localStorage.setItem('cys.tab',t)}catch(e){}
  window.scrollTo(0,0);schedule();
}

var toastT=0;
function toast(msg){
  var el=$('#toast');el.textContent=msg;el.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},2800);
}

document.addEventListener('click',function(e){
  if(e.target===$('#backdrop')){closeSheet();return}
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  switch(act){
    case 'tab':setTab(b.getAttribute('data-tab'));break;
    case 'close-sheet':closeSheet();break;
    case 'chip-sell':catSell=b.getAttribute('data-cat');schedule();break;
    case 'chip-prod':catProd=b.getAttribute('data-cat');schedule();break;
    case 'chip-stock':stockF=b.getAttribute('data-s');schedule();break;
    case 'add':addToCart(id);break;
    case 'open-cart':openCart();break;
    case 'cart-inc':addToCart(id);refreshCart();break;
    case 'cart-dec':if(cart[id]>1)cart[id]--;else delete cart[id];schedule();refreshCart();break;
    case 'cart-clear':cart={};closeSheet();schedule();break;
    case 'pay':pay=b.getAttribute('data-pay');refreshCart();break;
    case 'sell-confirm':confirmSale();break;
    case 'new-product':openProduct(null);break;
    case 'edit-product':openProduct(id);break;
    case 'photo-clear':pf.photo=null;updPreview();break;
    case 'stock-inc':case 'stock-dec':{
      var s=$('#pf-stock'),v=parseInt(s.value,10);if(!isFinite(v))v=0;
      s.value=Math.max(0,v+(act==='stock-inc'?1:-1));break;
    }
    case 'pf-del-ask':$('#pf-del-box').hidden=false;$('#pf-del-ask').hidden=true;break;
    case 'pf-del-no':$('#pf-del-box').hidden=true;$('#pf-del-ask').hidden=false;break;
    case 'pf-del-yes':{
      var pid=pf.id;delete cart[pid];
      del('products',pid).then(function(ok){if(ok){closeSheet();toast('Producto eliminado')}});break;
    }
    case 'exp-preset':setPreset(b.getAttribute('data-p'));break;
    case 'exp-go':exportExcel();break;
    case 'open-backup':openSheet('backup','Copia de seguridad',backupHTML());break;
    case 'backup-export':exportBackup();break;
    case 'backup-no':pendingBackup=null;setSheetBody(backupHTML());break;
    case 'backup-restore-yes':restoreBackup();break;
    case 'open-cats':openCats();break;
    case 'cat-rename':editCat=id;catDelId=null;refreshCats('#cr-name');break;
    case 'cat-delete':{
      var n=prods().filter(function(p){return p.cat===id}).length;
      if(n){toast('Tiene '+n+(n===1?' producto':' productos')+'. Cambialos de categoría primero.');break}
      catDelId=id;editCat=null;refreshCats();break;
    }
    case 'cat-delete-yes':del('categories',id).then(function(){catDelId=null;refreshCats();toast('Categoría eliminada')});break;
    case 'cat-cancel':editCat=null;catDelId=null;refreshCats();break;
    case 'day-prev':setDay(addDays(reportDay,-1));break;
    case 'day-next':setDay(addDays(reportDay,1));break;
    case 'close-day':closeDay();break;
    case 'reopen-day':del('closings',reportDay).then(function(){toast('Día reabierto')});break;
    case 'copy-summary':copySummary();break;
    case 'download-csv':downloadCsv();break;
    case 'void-sale':voidId=id;schedule();break;
    case 'void-no':voidId=null;schedule();break;
    case 'void-yes':voidId=null;voidSale(id);break;
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetKind)closeSheet()});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='q'){qSell=e.target.value;schedule()}
  else if(id==='pq'){qProd=e.target.value;schedule()}
  else if(id==='pf-cost'||id==='pf-price')updMargin();
});
document.addEventListener('change',function(e){
  if(e.target.id==='rday'&&e.target.value)setDay(e.target.value);
  else if(e.target.id==='bk-file'&&e.target.files&&e.target.files[0]){
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var o=JSON.parse(rd.result);
        if(!o||o.app!=='caja-y-stock'||!o.data)throw new Error('formato');
        pendingBackup=o;
        var np=Object.keys(o.data.products||{}).length,ns=Object.keys(o.data.sales||{}).length;
        setSheetBody(backupHTML()+'<div class="confirm">Se reemplazan todos los datos de este teléfono por esta copia ('+np+(np===1?' producto, ':' productos, ')+ns+(ns===1?' venta':' ventas')+'). ¿Restaurar?<div class="row-actions"><button class="btn btn-danger" type="button" data-act="backup-restore-yes">Sí, restaurar</button><button class="btn" type="button" data-act="backup-no">No</button></div></div>');
      }catch(x){var er=$('#bk-err');er.textContent='Ese archivo no es una copia de Caja y Stock.';er.hidden=false}
    };
    rd.readAsText(e.target.files[0]);e.target.value='';
  }
  else if(e.target.id==='pf-file'&&e.target.files&&e.target.files[0]){
    var f=e.target.files[0];
    compress(f,420,0.72).then(function(u){pf.photo=u;updPreview()},function(){toast('No se pudo leer la foto. Probá con otra.')});
    e.target.value='';
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var id=e.target.id;
  if(id==='pform')saveProduct();
  else if(id==='cform'){
    var inp=$('#cf-name'),name=inp.value.trim();
    if(!name)return;
    var dup=cats().some(function(c){return norm(c.name)===norm(name)});
    if(dup){toast('Ya existe esa categoría');return}
    put('categories',newId(),{name:name,createdAt:Date.now()}).then(function(ok){if(ok)refreshCats('#cf-name')});
  }else if(id==='crform'){
    var cid=e.target.getAttribute('data-id'),nm=$('#cr-name').value.trim();
    if(!nm)return;
    var clash=cats().some(function(c){return c.id!==cid&&norm(c.name)===norm(nm)});
    if(clash){toast('Ya existe esa categoría');return}
    put('categories',cid,Object.assign({},S.categories[cid],{name:nm})).then(function(){editCat=null;refreshCats()});
  }
});

/* ---------- boot ---------- */
render();
setPreset('month');
(function boot(){
  if(!window.indexedDB){syncErr=true;render();toast('Este navegador no permite guardar datos.');return}
  idbOpen().then(function(db){idb=db;return idbLoadAll()}).then(function(){
    mode='local';COLS.forEach(function(c){loaded[c]=true});
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    render();
  },function(e){syncErr=true;fail(e);render()});
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
})();
</script>
